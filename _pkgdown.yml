url: https://code-neuro.github.io/ptestR

template:
  bootstrap: 5
  bslib:
    bg:              "#F1E2D1"
    fg:              "#541A1A"
    primary:         "#810B38"
    secondary:       "#DCC3AA"
    success:         "#810B38"
    info:            "#F1E2D1"
    warning:         "#810B38"
    danger:          "#541A1A"

    base_font:       {google: "Afacad"}
    heading_font:    {google: "Livvic"}
    code_font:       {google: "JetBrains Mono"}

    font-size-base:  "1rem"
    headings-font-weight: 700

    card-bg:         "#FFFFFF"
    card-border-color: "#DCC3AA"
    card-border-radius: "0.75rem"

    pre-bg:          "#541A1A"
    pre-color:       "#F1E2D1"

  includes:
    in_header: |
      <style>
        .navbar {
          background-color: #541A1A !important;
          border-bottom: 2px solid #810B38;
        }
        .navbar .navbar-brand,
        .navbar-nav .nav-link,
        .navbar-nav .nav-link:hover,
        .navbar form .btn {
          color: #F1E2D1 !important;
        }
        .navbar-nav .nav-link:hover { opacity: 0.8; }
        .navbar-nav .nav-link.active {
          color: #F1E2D1 !important;
          border-bottom: 3px solid #F1E2D1;
          font-weight: 700;
        }
        .navbar small.nav-text { color: #DCC3AA !important; }
        .navbar-brand img { height: 40px; width: auto; }
        .page-header { border-bottom: none !important; }
        .sidebar .nav-link,
        .sidebar a,
        #toc a,
        #toc .nav-link {
          color: #541A1A !important;
        }
        .sidebar .nav-link:hover,
        .sidebar a:hover,
        #toc a:hover {
          color: #810B38 !important;
        }
        .sidebar .nav-link.active,
        #toc .nav-link.active {
          color: #810B38 !important;
          border-left: 2px solid #DCC3AA;
          font-weight: 600;
        }
        .text-muted { color: #810B38 !important; }
        .sidebar { border-left: 3px solid #DCC3AA; padding-left: 1rem; }
        .reference-index h2 {
          color: #810B38;
          font-size: 0.8rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }
        code {
          color: #810B38;
          background: #F1E2D1;
          border-radius: 4px;
          padding: 0.1em 0.35em;
        }
        .footer { background: #541A1A; color: #DCC3AA; padding: 1.5rem 0; }
        .footer a { color: #F1E2D1; }
        #search-input { border-color: #810B38; }
        .badge.bg-primary { background-color: #810B38 !important; }
        a { color: #810B38; }
        a:hover { color: #541A1A; }
      </style>

logo: man/figures/logo.svg

home:
  title: "ptestR — Permutation Tests for R"
  description: >
    An R package providing permutation-based significance testing for
    generalised linear models, linear mixed-effects models, and binomial
    logistic regression. Developed at King's College London.
  links:
  - text: CoDe-Neuro Lab
    href: https://github.com/CoDe-Neuro
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  structure:
    left:  [reference, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/CoDe-Neuro/ptestR
      aria-label: GitHub

reference:
- title: "Permutation tests"
  desc: "Nonparametric significance testing for regression models."
  contents:
  - grouped_perm_glm
  - grouped_perm_glmm
  - grouped_perm_binoglm

- title: "Package"
  desc: "Package-level documentation."
  contents:
  - ptestR-package

authors:
  Lucas França:
    href: https://orcid.org/0000-0003-0853-1319
  Dafnis Batalle:
    href: https://orcid.org/0000-0003-2097-979X

footer:
  structure:
    left: [package, developed_by]
    right: [built_with]
  components:
    package: >
      **ptestR** — CoDe-Neuro Lab, King's College London.
    developed_by: >
      Lucas França, Yan Ge & Dafnis Batalle.
