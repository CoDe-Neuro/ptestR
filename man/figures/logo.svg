    <path transform="translate(430.113,620) scale(0.042969,-0.042969)" d="M1087 729Q1176 716 1237.0 670.0Q1298 624 1343 537L1561 121H1714V0H1223L985 451Q916 591 867.5 629.5Q819 668 733 668H672V121H864V0H96V121H287V1372H96V1493H948Q1208 1493 1349.5 1388.5Q1491 1284 1491 1092Q1491 936 1390.5 845.5Q1290 755 1087 729ZM672 788H803Q943 788 1018.5 864.0Q1094 940 1094 1081Q1094 1222 1018.5 1297.0Q943 1372 803 1372H672Z" fill="#810B38"/>
  </g>

  <polygon points="340,0 680,196 680,589 340,785 0,589 0,196" fill="none" stroke="#810B38" stroke-width="10"/>
  <polygon points="340,30 650,210 650,575 340,755 30,575 30,210" fill="none" stroke="#541A1A" stroke-width="2" opacity="0.2"/>

  </g>
</svg>
