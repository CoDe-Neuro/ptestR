<svg xmlns="http://www.w3.org/2000/svg" width="192" height="220" viewBox="0 0 720 825" role="img">
  <title>ptestR hex sticker</title>
  <desc>Hex sticker for ptestR R package — permutation-based significance testing</desc>

  <defs>
    <clipPath id="hc_v2">
      <polygon points="340,0 680,196 680,589 340,785 0,589 0,196"/>
    </clipPath>
  </defs>

  <!-- Margin added: the hex previously touched all four viewBox edges exactly
       (0,0 to 680,785), so the 10px outer-border stroke was being truncated
       by the canvas on every side. Wrapping everything in a 20px translate
       and growing the viewBox by 40 in each dimension gives the stroke room
       to breathe, matching the padded convention every other package uses. -->
  <g transform="translate(20,20)">

  <polygon points="340,0 680,196 680,589 340,785 0,589 0,196" fill="#F1E2D1"/>
  <polygon points="340,22 658,208 658,577 340,763 22,577 22,208" fill="none" stroke="#DCC3AA" stroke-width="16"/>

  <!-- Null distribution — muted tan -->
  <path d="M100,480 C130,478 160,460 200,400 C230,355 255,305 290,290 C310,283 330,288 340,290 C350,292 360,285 380,278 C415,262 445,285 480,330 C510,370 545,420 575,458 C600,486 630,490 650,488"
        fill="none" stroke="#DCC3AA" stroke-width="5.5" stroke-linecap="round" clip-path="url(#hc_v2)"/>

  <!-- Shaded tail -->
  <path d="M430,490 C430,490 445,468 462,440 C478,414 500,378 520,350 C540,324 562,300 580,285 C600,270 625,268 648,270 L648,490 Z"
        fill="#810B38" opacity="0.18" clip-path="url(#hc_v2)"/>

  <!-- Observed statistic line -->
  <line x1="430" y1="265" x2="430" y2="490" stroke="#541A1A" stroke-width="4.5" stroke-linecap="round" opacity="0.85" clip-path="url(#hc_v2)"/>

  <!-- Fitted distribution — burgundy -->
  <path d="M120,490 C150,488 180,472 220,430 C255,393 285,340 310,310 C323,295 333,286 340,284 C347,282 358,290 372,305 C396,330 422,370 450,410 C475,445 510,474 545,484 C575,490 620,490 650,490"
        fill="none" stroke="#810B38" stroke-width="7" stroke-linecap="round" clip-path="url(#hc_v2)"/>

  <!-- p.perm dot + line -->
  <line x1="430" y1="305" x2="530" y2="258" stroke="#541A1A" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="430" cy="305" r="7" fill="#810B38" opacity="0.9"/>
  <text x="537" y="252" font-family="'Georgia', serif" font-size="34" font-weight="700" fill="#541A1A" opacity="0.75" clip-path="url(#hc_v2)">p.perm</text>

  <!-- Converted to vector paths (DejaVu Serif Bold outlines, extracted via
       fontTools) instead of a live <text> element. Same cairosvg
       text-anchor="middle" multi-tspan bug found in hypnoR/axR/stateR:
       measured centre was x=420.5 instead of x=340. It was clipped so it
       didn't escape the hex, but sat visibly off-centre, crowded against
       the edge. -->
  <g>
    <path transform="translate(176.754,620) scale(0.042969,-0.042969)" d="M553 584V479Q553 293 600.5 210.0Q648 127 754 127Q863 127 907.5 215.0Q952 303 952 532Q952 761 907.5 848.5Q863 936 754 936Q648 936 600.5 853.0Q553 770 553 584ZM199 942H47V1063H553V928Q598 1011 674.0 1051.5Q750 1092 862 1092Q1089 1092 1219.5 942.5Q1350 793 1350 532Q1350 271 1219.5 121.0Q1089 -29 862 -29Q750 -29 674.0 11.5Q598 52 553 135V-305H717V-426H47V-305H199Z" fill="#541A1A"/>
