    <path transform="translate(337.922,620) scale(0.042969,-0.042969)" d="M96 31V328H209Q223 209 298.0 146.5Q373 84 502 84Q610 84 667.5 121.5Q725 159 725 229Q725 293 688.5 328.0Q652 363 547 389L401 426Q236 467 162.0 543.5Q88 620 88 750Q88 923 208.0 1007.5Q328 1092 578 1092Q672 1092 778.5 1076.5Q885 1061 1014 1028V760H901Q892 869 823.5 924.0Q755 979 627 979Q519 979 463.5 944.5Q408 910 408 844Q408 790 440.0 759.0Q472 728 555 707L700 670Q909 617 989.0 539.0Q1069 461 1069 322Q1069 142 940.5 56.5Q812 -29 541 -29Q442 -29 331.0 -14.0Q220 1 96 31Z" fill="#541A1A"/>
